schema_version: 1

context:
  version: "8.0.2"

  # Component versions
  lal_version: "8.0.1"
  lalframe_version: "3.1.1"
  lalmetaio_version: "4.1.1"
  lalsimulation_version: "7.0.1"
  lalburst_version: "3.0.1"
  lalinspiral_version: "5.1.1"
  lalinference_version: "5.0.1"
  lalpulsar_version: "8.0.1"
  lalapps_version: "11.0.0"

package:
  name: lalsuite
  version: ${{ version }}

source:
  url: https://software.igwn.org/sources/source/lalsuite/lalsuite-metapackage-${{ version }}.tar.xz
  sha256: fbf411922746fffa84c1e7a93b1a7a1ca1b68f48f12779655d41ce6dd2d35cca

build:
  noarch: python
  number: 0
  script:
    - cd ${{ RECIPE_DIR }}
    - ${{ PYTHON }} -m pip install -vv .

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=38.3.0
    - wheel
  run:
    - python >=${{ python_min }}
    - lal ${{ lal_version }}.*
    - lalframe ${{ lalframe_version }}.*
    - lalmetaio ${{ lalmetaio_version }}.*
    - lalsimulation ${{ lalsimulation_version }}.*
    - lalburst ${{ lalburst_version }}.*
    - lalinspiral ${{ lalinspiral_version }}.*
    - lalpulsar ${{ lalpulsar_version }}.*
    - lalinference ${{ lalinference_version }}.*
    - lalapps ${{ lalapps_version }}.*

tests:
  - python:
      imports:
        - lal
        - lalframe
        - lalmetaio
        - lalsimulation
        - lalburst
        - lalinspiral
        - lalpulsar
        - lalinference
        - lalapps
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      recipe:
        - setup.cfg
        - test_component_versions.py
    requirements:
      run:
        - pytest
    script:
      - pytest test_component_versions.py -v -ra -k 'not lalapps'

about:
  summary: LSC Algorithm Library Suite
  description: |
    The LSC Algorithm Library Applications for gravitational wave data
    analysis.  This package contains applications that are built on tools
    in the LSC Algorithm Library.
  homepage: https://wiki.ligo.org/Computing/LALSuite
  repository: https://git.ligo.org/lscsoft/lalsuite.git
  documentation: https://lscsoft.docs.ligo.org/lalsuite/
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - duncanmmacleod
    - skymoo
